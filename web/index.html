<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04060d" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/assets/nasa-logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/iss-preview.png" />
    <link rel="preload" as="image" href="/assets/earth-blue-marble.jpg" fetchpriority="low" />
    <title>IGNIS — Microgravity Combustion &amp; Spacecraft Fire Safety</title>
    <meta
      name="description"
      content="AI-powered research platform over NASA NTRS microgravity combustion and spacecraft fire-safety data."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Applied before first paint so direction and font stack are correct on load.
      (function () {
        try {
          var saved = localStorage.getItem("ignis.locale");
          var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
          var supported = ["en","ar","fr","es","de","pt","ru","zh","ja","hi"];
          var code = saved && supported.indexOf(saved) > -1 ? saved : (supported.indexOf(nav) > -1 ? nav : "en");
          document.documentElement.lang = code;
          document.documentElement.dir = code === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
