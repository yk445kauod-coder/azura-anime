<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IGNIS — Microgravity Combustion &amp; Spacecraft Fire Safety</title>
    <meta
      name="description"
      content="AI-powered research platform over NASA NTRS microgravity combustion and spacecraft fire-safety data."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Applied before first paint so direction and font stack are correct on load.
      (function () {
        try {
          var saved = localStorage.getItem("ignis.locale");
          var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
          var supported = ["en","ar","fr","es","de","pt","ru","zh","ja","hi"];
          var code = saved && supported.indexOf(saved) > -1 ? saved : (supported.indexOf(nav) > -1 ? nav : "en");
          document.documentElement.lang = code;
          var xf = {ar:"Noto+Naskh+Arabic:wght@400;600",zh:"Noto+Sans+SC:wght@400;500;700",ja:"Noto+Sans+JP:wght@400;500;700",hi:"Noto+Sans+Devanagari:wght@400;600"}[code];
          if (xf) { var l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=" + xf + "&display=swap"; document.head.appendChild(l); }
          document.documentElement.dir = code === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
